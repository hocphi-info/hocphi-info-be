# fly.toml app configuration file generated for hocphi-info-api on 2026-09-06T03:38:20+07:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'hocphi-info-api'
primary_region = 'sin'

# Dockerfile co 2 stage (build + runtime). Pin target de Docker khong lay nham
# stage cuoi neu file thay doi — runtime = non-root, chay uvicorn tu .venv.
[build]
  target = 'runtime'

[env]
PORT = '8000'
ALLOW_ORIGINS = 'https://hocphi.info,https://www.hocphi.info'

[http_service]
internal_port = 8000
force_https = true
# 'suspend' thay vi 'stop': may ngu (snapshot RAM ra dia) thay vi tat han +
# reboot. Fly proxy resume no trong ~1s VA GIU request trong luc resume — het
# canh proxy tra 403 vi "0 may dang chay" khi co request toi luc scale-to-zero
# (nguyen nhan 403 chap chon o /nganh, /truong). Chi phi ~= 'stop' (chi ton
# rootfs storage), khong phai may chay 24/7 nhu min_machines_running=1.
auto_stop_machines = 'suspend'
auto_start_machines = true
min_machines_running = 0
processes = ['app']


[[http_service.checks]]
grace_period = "10s" # generous enough for DB pool warm-up on cold start
interval = "30s"
method = "GET"
timeout = "5s"
path = "/health"

[[vm]]
memory = '512mb'
cpu_kind = 'shared'
cpus = 1
memory_mb = 512

[project]
name = "hocphi-info-be"
version = "0.1.0"
description = "Backend API cho hocphi.info — tra cuu & so sanh hoc phi dai hoc Viet Nam"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0,<2.2",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "redis>=5.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.8",
    "mypy>=1.13",
]

# ── Cong cu ──────────────────────────────────────────────────────────────────
# uv dung [dependency-groups] (PEP 735) cho dev-deps, khong phai
# [project.optional-dependencies]. `uv sync` cai ca hai; `uv sync --no-dev` cho prod.

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["app", "tests", "scripts", "crawler"]

[tool.ruff.lint]
# E/F pyflakes+pycodestyle, I isort, UP pyupgrade, B bugbear,
# SIM flake8-simplify, C4 comprehensions, ASYNC async-correctness, RUF ruff-native
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "ASYNC", "RUF"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["E501"]  # dong SQL trong migration dai la binh thuong
# B008: Depends()/Query() o default arg la idiom chuan cua FastAPI.
"app/*" = ["B008"]
"tests/*" = ["B008"]

[tool.mypy]
python_version = "3.12"
# KHONG bat "sqlalchemy.ext.mypy.plugin" — deprecated o 2.0, xoa o 2.1.
# Kieu Mapped[] duoc mypy hieu native.
plugins = ["pydantic.mypy"]
exclude = ['^alembic/versions/']
# Du an hoc: bat dan cac check thay vi strict ngay.
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["alembic.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Fixture VA test phai dung CHUNG 1 event loop (session) — nguoc lai engine
# (asyncpg pool tao o loop cua fixture session) bi dung tu test o loop khac
# ("attached to a different loop"). pytest-asyncio 1.x tach 2 tuy chon nay.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
